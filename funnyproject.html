<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            box-sizing:border-box;
            margin:0px;
            padding:0px;
            font-family: 'Comic Sans MS', cursive;
        }

        body{
            background-color: #1a1a2e;
            height:100%;
            width:100%;
        }

        .box{
            background-color: #16213e;
            border: 3px solid #ff6b6b; 
            height:700px;
            width:700px;
            position:absolute;
            left:50%;
            top:50%;
            transform:translate(-50%,-50%);
            white-space: nowrap;
            overflow: hidden;
        }

        .big{
            background: #ff6b35;
            height:130px;
            width:130px;
            position:absolute;
            left:50%;
            top:50%;
            transform:translate(-50%,-50%);
            transition:all 0.3s ease;
            display:flex;
            justify-content: center;
            align-items: center;
            cursor:pointer;
        }

        .heading1{
            position:absolute;
            left: 550px;
            top:40px;
            color:white;
        }

        img{
            position: absolute;
            top:20%;
            left:5%;
            height: 350px;
            width:350px;
        }


    </style>
</head>
<body>
    <h1 class="heading1">Catch me if you can by Akhil Dhiman</h1>

    <div class="box">
        <div class="big" id="big">AAJA BHAI</div>
     </div>
</body>
<script>
    let count=0;
    let counter = document.getElementById("counter");
    let btn=document.getElementById("big");
    btn.addEventListener('mouseenter',function(){
        btn.style.left=Math.random()*80+"%";
        btn.style.top=Math.random()*80+"%";
        btn.style.transform='translate(0,0)';
        let colors = ['#ff6b6b', '#ffd93d', '#6bcb77', '#4d96ff', '#ff6bff'];
        btn.style.background = colors[Math.floor(Math.random() * colors.length)];
        btn.style.color = '#1a1a2e';
   
    })

</script>
</html>
