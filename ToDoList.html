<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>To Do List AKHIL DHIMAN</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: sans-serif;
}

body{
    background: linear-gradient(-45deg,
    #667eea,
    #764ba2,
    #6dd5fa,
    #23d5ab);
    background-size:400% 400%;
    animation:gradient 12s ease infinite;
    height:100vh;
}

@keyframes gradient{
    0%{
        background-position:0% 50%;
    }
    50%{
        background-position:100% 50%;
    }
    100%{
        background-position:0% 50%;
    }
}

.bigdiv{
    background:linear-gradient(135deg,#ff9a9e,#fad0c4);
    height:800px;
    width:800px;
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    border-radius:20px;
    
}

.heading{
    display:flex;
    justify-content:center;
    margin-top:50px;
}

.h1{
    font-size:40px;
    
}

.input{
    position:absolute;
    top:140px;
    left:70px;
}

.input input{
    width:450px;
    height:48px;
    padding:0 15px;
    font-size:16px;
    border:2px solid #d1d5db;
    border-radius:10px;
    transition:0.3s;
    background:#fff;
}


.search{
    width:450px;
    height:48px;
    position:absolute;
    left:70px;
    top:200px;
    padding:0 15px;
    font-size:16px;
    border:2px solid #d1d5db;
    border-radius:10px;
    transition:0.3s;
    background:#fff;
}

.input input:hover{
    border-color:#667eea;

}

.search:hover{
    border-color:#667eea;
}


.submit{
    position:absolute;
    top:140px;
    left:540px;
    width:110px;
    height:45px;

    background:#2563eb;
    color:white;
    border:none;
    border-radius:8px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

.submit:hover{
    background:#1d4ed8;
    transform:translateY(-2px);
}

.container{
    height:500px;
    width:100%;
    background:white;
    position:absolute;
    left:0;
    top:300px;
    
    padding:10px;
    overflow-y: auto;
}

.todo-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:#f3f3f3;
    padding:12px;
    margin-bottom:10px;
    border-radius:8px;
    gap:5px;
    
}

.todo-item p{
    font-size:18px;
    margin-right:420px;
}

.delete{
    background:#ef4444;
    color:white;
    border:none;
    padding:10px 18px;
    border-radius:8px;
    cursor:pointer;
    font-size:14px;
    font-weight:bold;
    transition:0.3s;
}

.delete:hover{
    background:#dc2626;
    transform:scale(1.05);
}

.add{
    background:#22c55e;
    color:white;
    border:none;
    padding:10px 18px;
    border-radius:8px;
    cursor:pointer;
    font-size:14px;
    font-weight:bold;
    transition:0.3s;
}

.add:hover{
    background:#16a34a;
    transform:scale(1.05);
}

.edit{
    background:#3b82f6;
    color:white;
    border:none;
    padding:10px 18px;
    border-radius:8px;
    cursor:pointer;
    font-size:14px;
    font-weight:bold;
    transition:0.3s;
}

.edit:hover{
    background:#2563eb;
    transform:scale(1.05);
}



</style>

</head>

<body>

<div class="bigdiv">
<input type="text" class="search" placeholder="Search Here">
    <div class="heading">
        <h1 class="h1">To do List</h1>
    </div>

    <div class="input">
        <input type="text" placeholder="Enter Task">
    </div>

    <input type="submit" class="submit" value="Add">

    <div class="container"></div>

</div> 


<script>

const todos=[];
const todoinput=document.querySelector(".input input");
const addbtn=document.querySelector(".submit");
const todolist=document.querySelector(".container");
const id=[]
const information=[];
const search=document.querySelector(".search");
search.textContent="Search Here"


    
function rendertask() {

    todolist.innerHTML = "";

    for (let i = 0; i < information.length; i++) {

        const todoitem = document.createElement("div");
        todoitem.classList.add("todo-item");

        const p = document.createElement("p");
        p.textContent = information[i].text;

        const done = document.createElement("button");
        done.textContent = "Complete";
        done.classList.add("add");

        const editbtn = document.createElement("button");
        editbtn.textContent = "Edit";
        editbtn.classList.add("edit");

        const deletebtn = document.createElement("button");
        deletebtn.textContent = "Delete";
        deletebtn.classList.add("delete");

        deletebtn.addEventListener("click", function () {
            
            information.splice(i, 1);
            rendertask();
        });

        editbtn.addEventListener("click", function () {
            const newtask = prompt("Edit your task", information[i].text);

            if (newtask !== null && newtask.trim() !== "") {
                information[i].text = newtask;
                rendertask();
            }
        });

        done.addEventListener("click", function () {
            todoitem.style.backgroundColor = "green";

            setTimeout(function () {
                information.splice(i, 1);
                rendertask();
            }, 3000);
        });

        todoitem.append(p, done, editbtn, deletebtn);
        todolist.prepend(todoitem);


   
}
 }


search.addEventListener("input", function () {

    let value = search.value.toLowerCase().trim();
    const items = document.querySelectorAll(".todo-item");
    items.forEach(function (item) {
    let task = item.querySelector("p").textContent.toLowerCase();

    if (task.includes(value)) {
            item.style.display = "flex";
    } 
    else {
            item.style.display = "none";
    }
    });
});



let count = 0;  

function addtodo(){
    const task = todoinput.value.trim();
    if(task === ""){
        return;
    }

    todos.unshift(task);
    localStorage.setItem("todos", JSON.stringify(todos));

    todoinput.value = "";
    todoinput.focus();

    count++;  
    const obj = {
        id: count,
        text: task,
        complete: false,
        edit: 0
    };

    information.push(obj);   
    id.push(count);           

    localStorage.setItem("information", JSON.stringify(information));
    localStorage.setItem("id", JSON.stringify(id));
    
        rendertask();
}



addbtn.addEventListener("click",addtodo);

todoinput.addEventListener("keydown",function(e){

    if(e.key==="Enter"){
        addtodo();
    }

});


</script>

</body>
</html>
