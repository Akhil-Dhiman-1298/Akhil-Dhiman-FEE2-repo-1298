<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Joke App</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #fafafa;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background:#0056b3;
    }

    .box {
      background: #fff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      text-align: center;
      width: 300px;
    }

    .setup {
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 10px;
      color: #333;
    }

    .punchline {
      font-size: 1rem;
      margin-bottom: 15px;
      color: #555;
    }

    .change {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .change:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
  <div class="box">
    <p class="setup"></p>
    <p class="punchline"></p>
    <button class="change">Get Joke</button>
  </div>
  <script src="promise.js"></script>
</body>
</html>
